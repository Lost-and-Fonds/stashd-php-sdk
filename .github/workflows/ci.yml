name: CI
on: [push, pull_request]

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: xml
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: test -s AGENTS.md
      - run: test -s README.md

# The rewrite bootstrap must replace this temporary scaffold job with the full
# lint, static-analysis, test, conformance, and PHPDoc-description gates before
# implementation is considered complete.
